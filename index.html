<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Conversor de Moedas</h1>
    </header>

    <main class="section-max">

        <!-- GIF ilustrativo -->
        <figure id="gif">
            <img src="./assets/0b855c3cee7fbceab7a89831e6096fe140b43ca9.gif" alt="GIF animado ilustrativo">
        </figure>

        <section class="conteiner-max">

            <!-- Formulário de conversão -->
            <form class="form-conversor">

                <div class="opitions">
                    <label for="input-real">Converter de:</label>
                    <input id="input-real" type="text" placeholder="R$ Real brasileiro" disabled>
                </div>

                <div class="opitions">
                    <label for="convertor">Converter para:</label>
                    <select id="convertor">
                        <option value="USD">$ Dólar Americano</option>
                        <option value="EUR">€ Euro</option>
                        <option value="GBP">£ Libra Esterlina</option>
                        <option value="BTC">₿ Bitcoin</option>
                    </select>
                </div>

                <div class="opitions valor">
                    <label for="valor">Valor:</label>
                    <input id="valor" type="text" placeholder="R$ 10.000,00">
                </div>

                <button type="button" class="buton">Converter</button>

            </form>

            <!-- Resultado da conversão -->
            <aside class="resultado-conversao conteiner-left-max">
                <figure>
                    <img src="./assets/brasil 2.png" id="img" alt="Bandeira do Brasil">
                    <figcaption>Real</figcaption>
                </figure>
                <p id="value-money">R$ 1</p>

                <img src="./assets/Vector.svg" alt="Seta de conversão">

                <figure>
                    <img id="icone" src="./assets/estados-unidos (1) 1.png" alt="Ícone da moeda selecionada">
                    <figcaption id="name2-money">Dólar</figcaption>
                </figure>
                <p id="value2-money">US$ 5.45</p>
            </aside>

        </section>

    </main>

    <footer>
        <p>&copy; 2025 Enoc Wellington</p>
    </footer>
</body>
    <!-- JS -->
    <script src="script.js"></script>

    

</html>
