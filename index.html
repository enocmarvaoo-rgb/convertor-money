<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>coverto de dinheiro</title>
</head>

<body>
    <section class="section-max">
        <div id="gif"><img src="./assets/0b855c3cee7fbceab7a89831e6096fe140b43ca9.gif" alt="gif"></div>
        <div class="conteiner-max">
            <div class="opitions">
                <p>concerter <b>de </b> </p>
                <input placeholder="R$ Real brasileiro">
            </div>
            <div class="opitions">
                <p>converter <b> para</b></p>
                <select  id="convertor">
                    <option value="USD">$ Dólar americano</option>
                    <option value="EUR">€ Euro</option>
                    <option value="GBP">£ libra esterlina</option>
                    <option value="BTC">₿ Biticoin</option>
                </select>
            </div>
            <div class="opitions valor">
                <p>valor</p>
                <input placeholder="R$ 10.000.00">
            </div>
            <button class="buton" >converter</button>
            <div>
                <div class="conteiner-left-max">
                    <img src="./assets/brasil 2.png" id="img" alt="icone-pais">
                    <p>Real  </p>
                    <p id="value-money">R$ 1</p>
                    <img src="./assets/Vector.svg" alt="seta">
                    <img id="icone" src="./assets/estados-unidos (1) 1.png"  alt="icone-pais">
                    <p id="name2-money">dolar</p>
                    <p id="value2-money">US$ 5.45</p>
                </div>

            </div>
        </div>
    </section>
</body>
<script src="script.js"></script>

</html>
